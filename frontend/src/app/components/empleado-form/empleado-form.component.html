<div class="card shadow-sm">
  <div class="card-body">
    <h4 class="card-title text-center mb-3">
      {{ (formData.id || formData._id) ? 'Editar Empleado' : 'Registro de Nuevo Empleado' }}
    </h4>

    <form #empleadoForm="ngForm" (ngSubmit)="onSubmit(empleadoForm)">
      <input type="hidden" name="id" [(ngModel)]="formData.id" />

      <div class="form-group mb-3">
        <label class="form-label">Nombre:</label>
        <input
          type="text"
          class="form-control"
          name="nombre"
          placeholder="Ingrese su nombre"
          required
          [(ngModel)]="formData.nombre"
        />
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Cargo:</label>
        <input
          type="text"
          name="cargo"
          class="form-control"
          placeholder="Ingrese su cargo"
          required
          [(ngModel)]="formData.cargo"
        />
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Departamento:</label>
        <input
          type="text"
          name="departamento"
          class="form-control"
          placeholder="Ingrese su departamento"
          required
          [(ngModel)]="formData.departamento"
        />
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Sueldo:</label>
        <input
          type="number"
          name="sueldo"
          class="form-control"
          placeholder="Ingrese su sueldo"
          required
          min="1"
          [(ngModel)]="formData.sueldo"
        />
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary flex-grow-1" type="submit" [disabled]="empleadoForm.invalid">
          {{ (formData.id || formData._id) ? 'Actualizar' : 'Guardar' }}
        </button>
        <button class="btn btn-secondary" type="button" (click)="onReset(empleadoForm)">
          Limpiar
        </button>
      </div>
    </form>
  </div>
</div>
